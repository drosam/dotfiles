id = "lastfocus"
name = "Last Focus"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Toggle between the last two focused tabs and workspaces"
platforms = ["macos", "linux"]

[[events]]
on = "tab.focused"
command = ["sh", "lastfocus.sh", "record"]

[[events]]
on = "workspace.focused"
command = ["sh", "lastfocus.sh", "record"]

[[actions]]
id = "last-tab"
title = "Focus last tab"
command = ["sh", "lastfocus.sh", "last-tab"]

[[actions]]
id = "last-workspace"
title = "Focus last workspace"
command = ["sh", "lastfocus.sh", "last-workspace"]
